# ==============================================================================
# kube-prometheus-stack Helm Values
# Platform: {{#if IS_K8S}}Kubernetes{{else}}EKS{{/if}}
# ==============================================================================

# ==============================================================================
# Prometheus
# - Collect metrics from Dynamo PodMonitors across all namespaces
# ==============================================================================
prometheus:
  prometheusSpec:
    # Allow PodMonitors from any namespace (required for Dynamo Operator auto-created PodMonitors)
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    # Allow ServiceMonitors from any namespace (required for DCGM Exporter)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # Allow Probes from any namespace
    probeNamespaceSelector: {}
    # Accept remote_write pushes (Tempo metrics-generator writes service-graph
    # and span/RED metrics here for the unified traffic dashboard).
    enableRemoteWriteReceiver: true
    # Retention
    retention: {{{RETENTION}}}
    # Storage
{{#if ENABLE_PERSISTENT_STORAGE}}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "{{{STORAGE_CLASS}}}"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: {{{PROMETHEUS_STORAGE_SIZE}}}
{{/if}}
{{#if ENABLE_INGRESS}}
    routePrefix: /prometheus
    externalUrl: "http://{{{INGRESS_HOST}}}/prometheus"
  ingress:
    enabled: true
    ingressClassName: "{{{INGRESS_CLASS}}}"
{{#if IS_EKS}}
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: dynamo-monitoring
{{/if}}
    paths:
      - /prometheus
    hosts:
      - "{{{INGRESS_HOST}}}"
{{/if}}

# ==============================================================================
# Grafana
# - Visualization dashboards for Dynamo metrics
# - Sidecar auto-discovers ConfigMaps with label grafana_dashboard: "1"
# ==============================================================================
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "{{{GRAFANA_ADMIN_PASSWORD}}}"

  # Register Tempo as a trace datasource for the unified traffic dashboard.
  # - serviceMap wires Tempo's service-graph metrics (in Prometheus) into the
  #   node-graph service map.
  # - tracesToLogsV2 / the derived data link jumps from a span to Langfuse using
  #   the shared trace_id (Beyla propagates the W3C traceparent, so the eBPF span
  #   and the Langfuse LLM observation carry the same trace id).
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      # tempo-distributed serves the query-frontend HTTP API on 3200 (the
      # single-binary Tempo default of 3100 does NOT apply to this chart).
      url: http://tempo-query-frontend.tempo.svc.cluster.local:3200
      jsonData:
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
{{#if DOMAIN}}
        # Deep-link a trace to its Langfuse view. Langfuse trace URLs are keyed
        # by trace id; ${__trace.traceId} is substituted by Grafana.
        tracesToLogsV2:
          datasourceUid: prometheus
        externalUrl: "https://langfuse.{{{DOMAIN}}}"
{{/if}}

{{#if ENABLE_INGRESS}}
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: "{{{INGRESS_CLASS}}}"
{{#if IS_EKS}}
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: dynamo-monitoring
{{/if}}
    path: /grafana
    hosts:
      - "{{{INGRESS_HOST}}}"
{{/if}}

  # Sidecar to auto-load dashboards from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false

# ==============================================================================
# Node Exporter
# - Required for CPU/Memory metrics in Dynamo dashboard
# ==============================================================================
nodeExporter:
  enabled: true

# ==============================================================================
# kube-state-metrics
# - Kubernetes object state metrics
# ==============================================================================
kubeStateMetrics:
  enabled: true

# ==============================================================================
# Alertmanager
# - Disabled by default (can be enabled for production alerting)
# ==============================================================================
alertmanager:
  enabled: {{{ALERTMANAGER_ENABLED}}}
